name: fetch-originals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [paintings.json, fetch.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python fetch.py
      - run: |
          git config user.name "ghost-art-bot"
          git config user.email "ghost-art-bot@users.noreply.github.com"
          git add orig
          git commit -m "Fetched originals"
          git push
