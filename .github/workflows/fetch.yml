name: fetch-originals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [paintings.json, fetch.py, big_jobs.json]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - run: pip install requests
      - run: if git diff --name-only HEAD~1 | grep -q big_jobs.json; then python fetch_big.py || true; else python fetch.py || true; fi
      - run: |
          git config user.name "ghost-art-bot"
          git config user.email "ghost-art-bot@users.noreply.github.com"
          git add orig big 2>/dev/null || git add orig
          git commit -m "Fetched originals" || true
          git pull --rebase
          git push
